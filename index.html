<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Casino</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- -------------------
  LOGIN / CREATION COMPTE
-------------------- -->
<div id="login-box" class="login-box">
  <h2>Connexion / Création de compte</h2>
  <input type="text" id="username" placeholder="Pseudo">
  <button id="login-btn">Se connecter / Créer compte</button>
  <p id="login-msg"></p>
</div>

<!-- -------------------
  APP PRINCIPALE
-------------------- -->
<div id="main-app" class="hidden">

  <header>
    <div id="player-name">Joueur</div>
    <div id="token-balance">0</div>
    <button id="logout-btn">Déconnexion</button>
  </header>

  <!-- MENU -->
  <div id="menu">
    <button class="game-btn" onclick="openGame('slots')">🎰 Slots</button>
    <button class="game-btn" onclick="openGame('roulette')">🎡 Roulette</button>
    <button class="game-btn" onclick="openGame('dice')">🎲 Dés</button>
    <button class="game-btn" onclick="openGame('wheel')">🌀 Roue</button>
    <button class="game-btn" onclick="openGame('coinFlip')">🪙 Pile ou Face</button>
    <button class="game-btn" onclick="openGame('guessNumber')">🔢 Chiffre Mystère</button>
    <button class="game-btn" onclick="openGame('blackjack')">🂡 Blackjack</button>
    <button class="game-btn" onclick="openStore()">🛒 Magasin</button>
  </div>

  <!-- AREA JEUX -->
  <div id="game-area" class="hidden">
    <div id="game-container"></div>
    <button onclick="closeGame()">Retour au menu</button>
  </div>

  <!-- AREA MAGASIN -->
  <div id="store-area" class="hidden">
    <h2>🛍️ Magasin</h2>
    <div id="store-items">
      <button onclick="buyItem('Chapeau',50)">Chapeau - 50 jetons</button>
      <button onclick="buyItem('Montre',150)">Montre - 150 jetons</button>
      <button onclick="buyItem('Voiture',500)">Voiture - 500 jetons</button>
    </div>
    <button onclick="closeStore()">Retour au menu</button>
  </div>

</div>

<!-- ANIMATION JETONS -->
<div id="token-animation"></div>

<script src="script.js"></script>
</body>
</html>
