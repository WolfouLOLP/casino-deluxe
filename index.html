<!DOCTYPE html>
<html lang="fr">
<head>
  <div class="align">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Casino</title>
  <link rel="stylesheet" href="../style.css">
  <!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>

</head>
<body>
  <!-- HEADER -->
  <header style="display:flex; justify-content:space-between; align-items:center; max-width:800px; width:90%; margin:auto; padding:10px 0;">
    <div id="token-balance">Jetons : 100</div>
    <button id="refill-tokens">💰 Recharger</button>
  </header>

  <!-- MENU PRINCIPAL -->

 <div id="authBox" class="auth-box">
    <h2>Connexion</h2>

    <input type="text" id="auth-username" placeholder="Nom d'utilisateur">
    <input type="password" id="auth-password" placeholder="Mot de passe">

    <button id="login-btn">Se connecter</button>
    <button id="register-btn">Créer un compte</button>

    <p id="auth-msg"></p>
</div>


  <section id="menu" style="display:flex; flex-wrap:wrap; justify-content:center; gap:20px; margin-top:30px;">
    <button class="game-btn" onclick="openGame('slots')">🎰 Slots</button>
    <button class="game-btn" onclick="openGame('roulette')">🎡 Roulette</button>
    <button class="game-btn" onclick="openGame('dice')">🎲 Dés</button>
    <button class="game-btn" onclick="openGame('wheel')">🌀 Roue</button>
    <button class="game-btn" onclick="openGame('coinFlip')">🪙 Pile ou Face</button>
    <button class="game-btn" onclick="openGame('guessNumber')">🔢 Chiffre Mystère</button>
    <button class="game-btn" onclick="openGame('blackjack')">🃏 Blackjack</button>
    <button class="game-btn" onclick="openGame('bingo')">🎯 Bingo rapide</button>
  <button class="game-btn" onclick="openGame('archery')">🏹 Tir à l'arc</button>
  <button class="game-btn" onclick="openGame('treasure')">🏝 Chasse au trésor</button>
  <button class="game-btn" onclick="openGame('magicCoin')">✨ Pile magique</button>
  <button class="game-btn" onclick="openGame('colorWheel')">🎨 Roulette des couleurs</button>
    <button id="double-or-nothing" class="special-btn" style="display:none;">
    🎲 DOUBLE OU RIEN 🎲
</button>

    <button class="game-btn" onclick="openLeaderboard()">🏆 Leaderboard</button>
  </section>
  
  <button onclick="window.location.href='magasin.html'">🛒 Magasin</button>


  <!-- GAME AREA -->
  <section id="game-area" class="hidden" style="margin-top:30px; max-width:600px; width:90%; margin:auto; padding:20px;">
    <div id="game-container"></div>
   
  </section>
  

  <!-- LEADERBOARD -->
  <section id="leaderboard-area" class="hidden" style="margin-top:30px; max-width:600px; width:90%; margin:auto;">
    <h2>🏆 Leaderboard</h2>
    <ul id="leaderboard-list"></ul>
    
  </section>

  <!-- CONTAINER POUR JETONS ANIMÉS -->
  <div id="token-animation" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden;"></div>
</body>



  <script src="../game.js"></script>
</body>


</html>
